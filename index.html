<title>Ledgerly</title>
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#161a35;--mute:#6a7090;--line:#e3e6f2;--acc:#ffb02e;--ai:#1a1530;--inc:#0e9f7b;--exp:#e5486a;--warn:#d98a00;--link:#4b4fd6;--sh:0 14px 30px -18px rgba(22,26,53,.35)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1022;--card:#161a33;--ink:#eef0ff;--mute:#9aa0c4;--line:#252a4a;--inc:#34d3a5;--exp:#ff6b8b;--link:#9aa2ff;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 130px}
h1{font-size:22px;margin:6px 0 14px;letter-spacing:-.3px}h2{font-size:15px;margin:26px 4px 10px;color:var(--mute);font-weight:600}h3{margin:0;font-size:18px}
.num{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.brand{display:flex;align-items:center;gap:10px}.brand i{width:30px;height:30px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--ai);font-style:normal;font-weight:800}
.hero{background:var(--acc);color:var(--ai);border-radius:30px;padding:20px 22px 22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:34px solid rgba(26,21,48,.07)}
.hero small{display:block;opacity:.7;font-size:12.5px}.hero .big{font-size:clamp(38px,11vw,60px);line-height:1.05;margin:2px 0 16px;position:relative}
.hero input{background:rgba(26,21,48,.1);border:0;color:var(--ai);border-radius:20px;padding:6px 12px;font-weight:600}
.hrow{display:flex;gap:22px;align-items:center;position:relative}.hrow b{font-size:18px}.ring{margin-left:auto;text-align:center;position:relative;width:76px;height:76px}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.stat small{color:var(--mute);display:block}.stat b{font-size:22px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:10px 0;box-shadow:var(--sh)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mute{color:var(--mute);font-size:13px}.inc{color:var(--inc)}.exp{color:var(--exp)}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
input[type=month]{width:auto}input[type=hidden]{display:none}
input:focus,select:focus{border-color:var(--acc);outline:0}
.btn{background:var(--ai);color:#fff;border:0;border-radius:14px;padding:11px 18px;font-weight:600;cursor:pointer;width:auto}
@media(prefers-color-scheme:dark){.btn{background:var(--acc);color:var(--ai)}}
.btn.alt{background:var(--bg);color:var(--ink)}.btn.bad{background:var(--exp);color:#fff}.btn.wide{width:100%;margin-top:14px;padding:14px}
.btn:focus-visible,nav button:focus-visible,.fab:focus-visible{outline:3px solid var(--link);outline-offset:2px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.bar{height:9px;background:var(--bg);border-radius:6px;overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;background:var(--link);border-radius:6px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.li:first-child{border:0}.grow{flex:1;min-width:0}
.li button{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 8px}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
ul.ins{margin:0;padding:0;list-style:none}ul.ins li{padding:8px 0 8px 18px;position:relative}ul.ins li:before{content:"";position:absolute;left:0;top:16px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.leg{flex:1;min-width:160px}.leg div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:8px 8px max(10px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;max-width:96px;background:none;border:0;color:var(--mute);display:grid;justify-items:center;gap:2px;font-size:11px;padding:6px 2px;border-radius:14px;cursor:pointer}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=true]{color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--acc) 30%,transparent)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--ai);color:var(--acc);font-size:32px;line-height:1;box-shadow:0 12px 26px -8px rgba(0,0,0,.5);cursor:pointer;z-index:6}
@media(prefers-color-scheme:dark){.fab{background:var(--acc);color:var(--ai)}}
dialog{margin:auto auto 0;width:min(560px,100%);border:0;border-radius:28px 28px 0 0;background:var(--card);color:var(--ink);padding:20px 20px max(22px,env(safe-area-inset-bottom))}
dialog::backdrop{background:rgba(10,12,30,.6);backdrop-filter:blur(3px)}.sheet{display:grid;gap:12px}.x{background:none;border:0;font-size:18px;color:var(--mute);cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}.seg label{margin:0}.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;text-align:center;padding:9px;border-radius:11px;cursor:pointer;color:var(--mute);font-weight:600}.seg input:checked+span{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.seg input:focus-visible+span{outline:3px solid var(--link)}
input.amt{font-size:38px;padding:12px 14px;text-align:center}.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lock{max-width:400px;margin:14vh auto 0;padding:0 20px}.lock h1{font-size:34px}.lock .card{padding:20px}
.res{font-size:24px;margin-top:12px}table{width:100%;border-collapse:collapse}td{padding:9px 0;border-top:1px solid var(--line)}td:last-child{text-align:right}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}dialog[open]{animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;touch-action:manipulation;background:radial-gradient(520px 320px at 100% -4%,color-mix(in srgb,#a855f7 15%,transparent),transparent),radial-gradient(480px 320px at -8% 18%,color-mix(in srgb,#06b6d4 13%,transparent),transparent),var(--bg)}
input,select,textarea{font-size:16px}[hidden]{display:none!important}
.hero .big{font-size:clamp(34px,10vw,56px)}
h2:before{content:"";display:inline-block;width:6px;height:14px;border-radius:3px;background:var(--acc);margin-right:8px;vertical-align:-2px}
nav button[aria-current=true]{background:color-mix(in srgb,var(--c) 26%,transparent)}nav button[aria-current=true] svg{stroke:var(--c)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.top h1{margin:0}.eye{background:var(--card);border:0;border-radius:14px;width:42px;height:42px;font-size:18px;cursor:pointer;box-shadow:var(--sh)}
.hide .num{filter:blur(9px)}
.t-g{background:color-mix(in srgb,var(--inc) 16%,var(--card))!important}.t-r{background:color-mix(in srgb,var(--exp) 14%,var(--card))!important}.t-b{background:color-mix(in srgb,#4b8bff 17%,var(--card))!important}.t-y{background:color-mix(in srgb,#a855f7 15%,var(--card))!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{margin:0}.chip input{position:absolute;opacity:0;width:0}
.chip span{display:block;padding:8px 12px;border-radius:20px;background:color-mix(in srgb,var(--cc) 16%,var(--bg));cursor:pointer;font-weight:600;color:var(--ink);font-size:14px;border:2px solid transparent}
.chip input:checked+span{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 32%,var(--bg))}.chip input:focus-visible+span{outline:3px solid var(--link)}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink)}.chk input{width:22px;height:22px}
#q{margin-bottom:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(158px + env(safe-area-inset-bottom));background:var(--ai);color:#fff;padding:10px 16px;border-radius:14px;z-index:9;display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
#toast button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;font-size:15px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mnav button{width:40px;height:40px;border-radius:14px;border:0;background:rgba(26,21,48,.13);font-size:24px;line-height:1;cursor:pointer;color:inherit}
.mlab{position:relative;flex:1;text-align:center;font-weight:700;font-size:17px;margin:0;color:inherit;cursor:pointer;display:block}.mlab input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0}
.mnav.pg{margin:18px 0 8px}.mnav.pg button{background:var(--card);box-shadow:var(--sh)}.mnav.pg .mlab{color:var(--ink)}
#recl{display:grid;gap:12px}
.hero:after{pointer-events:none}.mnav{position:relative;z-index:2}
</style></head><body><main id="app"></main><div id="toast" hidden role="status"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),A=$('#app');
const EXP=['Housing','Food','Transport','Bills','Health','Shopping','Fun','Education','Savings','Other','EMI'],INC=['Salary','Business','Investments','Other income'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let S=null,KEY=null,SALT=null,view='home',idle=null;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let month=today().slice(0,7);
const def=()=>({tx:[],budgets:{},goals:[],accts:[],cur:'INR'});
const fmt=n=>new Intl.NumberFormat(S.cur==='INR'?'en-IN':undefined,{style:'currency',currency:S.cur,maximumFractionDigits:0}).format(n);
const uid=()=>crypto.randomUUID();
/* ---------- crypto & storage ---------- */
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function save(){const raw=new TextEncoder().encode(JSON.stringify(S));let o;
 if(KEY){const iv=crypto.getRandomValues(new Uint8Array(12));o={e:1,s:b64(SALT),i:b64(iv),c:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,raw))}}else o={e:0,d:S};
 localStorage.setItem('ft',JSON.stringify(o))}
async function setPass(pw){SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(pw,SALT);await save()}
async function unlock(pw){const o=JSON.parse(localStorage.getItem('ft'));SALT=ub(o.s);KEY=await derive(pw,SALT);
 S=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},KEY,ub(o.c))))}
function lockNow(){S=null;KEY=null;boot()}
function bump(){clearTimeout(idle);if(KEY)idle=setTimeout(lockNow,10*60*1000)}
['click','keydown','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));
/* ---------- boot / lock ---------- */
function boot(){let o=null;try{o=JSON.parse(localStorage.getItem('ft'))}catch(e){}
 if(!o)return lockUI('new');
 if(o.e===0){S=Object.assign(def(),o.d);return render()}
 lockUI('unlock')}
function lockUI(mode){const n=mode==='new';
 A.innerHTML=`<div class="lock"><h1>Ledgerly</h1><p class="mute">${n?'Your data stays in this browser only. Set a passphrase to encrypt it (AES-256). There is no recovery if you forget it, so keep an encrypted backup.':'Enter your passphrase to unlock.'}</p>
 <form data-f="${n?'setup':'unlock'}"><input type="password" name="pw" minlength="${n?10:1}" placeholder="${n?'New passphrase (10+ characters)':'Passphrase'}" autocomplete="${n?'new-password':'current-password'}" required autofocus>
 <button class="btn">${n?'Create encrypted vault':'Unlock'}</button></form>
 ${n?'<p><button class="btn alt" data-a="plain">Continue without encryption</button></p>':''}<p class="exp" id="err" role="alert"></p></div>`}
/* ---------- data helpers ---------- */
const inM=m=>S.tx.filter(t=>t.date.startsWith(m));
const sum=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+x.amt,0);
const shift=(m,k)=>{let[y,mo]=m.split('-').map(Number);mo+=k;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+'-'+String(mo).padStart(2,'0')};
const byCat=l=>{const c={};l.filter(x=>x.type==='expense').forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amt);return Object.entries(c).sort((a,b)=>b[1]-a[1])};
const lbl=m=>new Date(m+'-01T00:00:00').toLocaleString(undefined,{month:'short'});
function insights(){const l=inM(month),inc=sum(l,'income'),ex=sum(l,'expense'),out=[];
 if(!l.length)return['Add a few transactions to unlock insights.'];
 if(inc>0){const r=(inc-ex)/inc*100;out.push(`Savings rate this month: <b>${r.toFixed(0)}%</b>${r>=20?' (above the common 20% target)':r<0?' (spending exceeds income)':' (aim for 20% or more)'}.`)}
 const cats=byCat(l);if(cats.length)out.push(`Biggest category: <b>${esc(cats[0][0])}</b>, ${fmt(cats[0][1])} (${(cats[0][1]/ex*100).toFixed(0)}% of spending).`);
 const pe=sum(inM(shift(month,-1)),'expense');if(pe>0&&ex>0){const d=(ex-pe)/pe*100;out.push(`Spending is <b>${Math.abs(d).toFixed(0)}% ${d>=0?'higher':'lower'}</b> than last month.`)}
 if(month===today().slice(0,7)&&ex>0){const d=new Date(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();out.push(`At this pace you will spend about <b>${fmt(ex/d.getDate()*dim)}</b> by month end.`)}
 Object.entries(S.budgets).forEach(([c,b])=>{const s=(cats.find(x=>x[0]===c)||[0,0])[1];if(b>0&&s>b)out.push(`<span class="exp">Over budget</span> on ${esc(c)} by ${fmt(s-b)}.`);else if(b>0&&s>b*.8)out.push(`${esc(c)} is at ${(s/b*100).toFixed(0)}% of its budget.`)});
 return out}
/* ---------- views ---------- */
function chart(){const ms=[...Array(6)].map((_,i)=>shift(month,i-5)),d=ms.map(m=>{const l=inM(m);return[sum(l,'income'),sum(l,'expense')]}),mx=Math.max(1,...d.flat());
 return`<svg viewBox="0 0 360 140" role="img" aria-label="Income and expenses over the last six months" width="100%">${ms.map((m,i)=>{const x=i*60+8;return`<rect x="${x}" y="${110-d[i][0]/mx*100}" width="20" height="${d[i][0]/mx*100}" fill="var(--inc)" rx="2"/><rect x="${x+22}" y="${110-d[i][1]/mx*100}" width="20" height="${d[i][1]/mx*100}" fill="var(--exp)" rx="2"/><text x="${x+21}" y="130" text-anchor="middle" font-size="11" fill="var(--mute)">${lbl(m)}</text>`}).join('')}</svg>
 <div class="mute"><span class="inc">■</span> Income &nbsp;<span class="exp">■</span> Expenses</div>`}
const CE={Housing:'🏠',Food:'🍜',Transport:'🚌',Bills:'💡',Health:'🩺',Shopping:'🛍️',Fun:'🎬',Education:'📚',Savings:'🏦',Other:'✨',EMI:'💳',Salary:'💼',Business:'🏪',Investments:'📈','Other income':'💰'};
const CC=['#ffb02e','#4b4fd6','#0e9f7b','#e5486a','#35a7ff','#a855f7','#f97316','#14b8a6','#eab308','#94a3b8','#ef4444'];
const col=c=>INC.includes(c)?'#0e9f7b':CC[Math.max(0,EXP.indexOf(c))%CC.length];
const chips=(a,sel)=>(sel&&!a.includes(sel)?[...a,sel]:a).map((c,i)=>`<label class="chip" style="--cc:${col(c)}"><input type="radio" name="cat" value="${c}" ${c===sel||(!sel&&!i)?'checked':''}><span>${CE[c]} ${c}</span></label>`).join('');
const cmp=n=>new Intl.NumberFormat(S.cur==='INR'?'en-IN':undefined,{notation:'compact',maximumFractionDigits:1}).format(n);
function donut(cats,tot){let o=0;const R=52,C=2*Math.PI*R;return`<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Spending by category"><g transform="rotate(-90 70 70)" fill="none" stroke-width="18"><circle cx="70" cy="70" r="${R}" stroke="var(--bg)"/>${cats.map(([c,v])=>{const l=v/tot*C,x=`<circle cx="70" cy="70" r="${R}" stroke="${col(c)}" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l;return x}).join('')}</g><text x="70" y="76" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)">${cmp(tot)}</text></svg>`}
const ico=t=>{const c=t.type==='income'?'var(--inc)':col(t.cat);return`<span class="ico" style="background:color-mix(in srgb,${c} 20%,transparent)">${CE[t.cat]||'✨'}</span>`};
function vHome(){const l=inM(month),inc=sum(l,'income'),ex=sum(l,'expense'),net=inc-ex,cats=byCat(l),nw=S.accts.reduce((a,x)=>a+x.bal,0),rate=inc>0?Math.max(0,Math.min(100,net/inc*100)):0,R=30,C=2*Math.PI*R,
 days=month===today().slice(0,7)?new Date().getDate():new Date(+month.slice(0,4),+month.slice(5),0).getDate();
 return`${S.tx.length?'':welcome()}<section class="hero">${mnav()}<small>Left after spending</small>
 <div class="big num">${fmt(net)}</div><div class="hrow"><div><small>Income</small><b class="num">${fmt(inc)}</b></div><div><small>Spent</small><b class="num">${fmt(ex)}</b></div>
 <div class="ring" role="img" aria-label="Savings rate ${rate.toFixed(0)} percent"><svg viewBox="0 0 76 76" width="76" height="76"><g transform="rotate(-90 38 38)" fill="none" stroke-width="8" stroke-linecap="round"><circle cx="38" cy="38" r="${R}" stroke="rgba(26,21,48,.15)"/><circle cx="38" cy="38" r="${R}" stroke="#1a1530" stroke-dasharray="${rate/100*C} ${C}"/></g></svg><b class="num">${rate.toFixed(0)}%</b></div></div></section>
 <div class="grid2"><div class="card stat t-b" style="margin:0"><small>Net worth</small><b class="num ${nw<0?'exp':''}">${fmt(nw)}</b></div><div class="card stat t-y" style="margin:0"><small>Daily average</small><b class="num">${fmt(ex/days)}</b></div><div class="card stat t-g" style="margin:0"><small>Top category</small><b>${cats.length?CE[cats[0][0]]+' '+esc(cats[0][0]):'—'}</b></div><div class="card stat t-r" style="margin:0"><small>Entries</small><b class="num">${l.length}</b></div></div>
 <h2>Insights</h2><div class="card"><ul class="ins">${insights().map(i=>`<li>${i}</li>`).join('')}</ul></div>
 <h2>Where it went</h2><div class="card">${cats.length?`<div class="dn">${donut(cats,ex)}<div class="leg">${cats.map(([c,v])=>`<div><span><i style="background:${col(c)}"></i>${esc(c)}</span><b class="num">${fmt(v)}</b></div>`).join('')}</div></div>`:'<span class="mute">No expenses yet this month. Tap + to add one.</span>'}</div>
 <h2>Last six months</h2><div class="card">${chart()}</div>`}
let q='',lastDel=null,tt;
const EXP0=[...EXP],INC0=[...INC],EMO=['🎁','🐶','🚗','✈️','📱','🧾','🍺','🏋️','👶','💄','🛒','🎮'];
function applyCats(){EXP.length=0;EXP.push(...EXP0);INC.length=0;INC.push(...INC0);(S.cats||[]).forEach(c=>{(c.type==='income'?INC:EXP).push(c.name);CE[c.name]=c.emoji})}
const catCard=()=>(S.cats&&S.cats.length)?`<h2>Your categories</h2><div class="card">${S.cats.map(c=>`<div class="li"><span class="ico" style="background:color-mix(in srgb,${col(c.name)} 20%,transparent)">${esc(c.emoji)}</span><span class="grow"><b>${esc(c.name)}</b><br><span class="mute">${c.type==='income'?'Income':'Spending'}</span></span><button data-a="delcat" data-id="${esc(c.name)}" aria-label="Remove category">✕</button></div>`).join('')}</div><p class="mute">Removing a category keeps your past entries.</p>`:'';
function catDialog(){return`<dialog id="cdlg" aria-label="New category"><form data-f="cat" class="sheet"><div class="row"><h3>New category</h3><button type="button" class="x" data-a="cclose" aria-label="Close">✕</button></div>
 <div class="seg"><label><input type="radio" name="ctype" value="expense" checked><span>Spending</span></label><label><input type="radio" name="ctype" value="income"><span>Income</span></label></div>
 <label>Name<input name="name" maxlength="24" required placeholder="e.g. Pets"></label>
 <div class="chips">${EMO.map((e,i)=>`<label class="chip" style="--cc:#a855f7"><input type="radio" name="emo" value="${e}" ${i?'':'checked'}><span>${e}</span></label>`).join('')}</div>
 <label>Monthly budget (optional, spending only)<input name="bud" type="number" min="0" inputmode="decimal" placeholder="No limit"></label><button class="btn wide">Create category</button></form></dialog>`}
const mlab=()=>new Date(month+'-01T00:00:00').toLocaleString(undefined,{month:'long',year:'numeric'});
const mnav=c=>`<div class="mnav ${c||''}"><button data-a="pm" aria-label="Previous month">‹</button><label class="mlab">${mlab()}<input type="month" value="${month}" data-c="month" aria-label="Pick month"></label><button data-a="nm" aria-label="Next month">›</button></div>`;
const welcome=()=>`<div class="card t-y"><b>Welcome 👋 Let's get you started</b><ol class="mute" style="padding-left:20px;margin:8px 0 12px"><li>Tap <b>+</b> and add your first income or expense</li><li>Open <b>Budgets</b> and try Auto-suggest later</li><li>Download a backup from <b>More</b></li></ol><button class="btn" data-a="add">Add first entry</button></div>`;
const txList=()=>{const l=inM(month).filter(t=>!q||(t.cat+' '+(t.note||'')+' '+t.amt).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
 return l.length?l.map(t=>`<div class="li">${ico(t)}<span class="grow" data-a="edit" data-id="${t.id}" style="cursor:pointer"><b>${esc(t.cat)}</b>${t.rec?' ↻':''}<br><span class="mute">${esc(t.date)}${t.note?' · '+esc(t.note):''}</span></span><span class="num ${t.type==='income'?'inc':''}">${t.type==='income'?'+':'−'}${fmt(t.amt)}</span><button data-a="deltx" data-id="${t.id}" aria-label="Delete transaction">✕</button></div>`).join(''):'<span class="mute">Nothing found. Tap + to add an entry.</span>'};
function vTx(){return`<h2>Activity</h2>${mnav('pg')}<input type="search" id="q" placeholder="Search category, note or amount" value="${esc(q)}" aria-label="Search"><div class="card" id="list">${txList()}</div><p class="mute" style="text-align:center">Tap an entry to edit it.</p>`}
const recCard=()=>(S.rec&&S.rec.length)?`<h2>Repeating and EMIs</h2><div class="card">${S.rec.map(r=>`<div class="li" style="flex-wrap:wrap">${ico(r)}<span class="grow"><b>${esc(r.note||r.cat)}</b> · day ${r.day}<br><span class="mute">${r.emi?(r.paid>=r.total?'EMI paid off ✓':`EMI · ${r.paid} of ${r.total} paid · ${fmt(r.amt*(r.total-r.paid))} left`):'Every month · '+esc(r.cat)}</span></span><span class="num">${fmt(r.amt)}</span><button data-a="delrec" data-id="${r.id}" aria-label="Remove">✕</button>${r.emi?`<div class="bar" style="flex-basis:100%;margin:0"><i style="width:${r.paid/r.total*100}%;background:var(--inc)"></i></div>`:''}</div>`).join('')}</div>`:'';
function applyRec(){let ch=0;const cur=today().slice(0,7);(S.rec||[]).forEach(r=>{while(r.last<cur&&!(r.emi&&r.paid>=r.total)){r.last=shift(r.last,1);if(r.emi)r.paid++;S.tx.push({id:uid(),date:r.last+'-'+String(r.day).padStart(2,'0'),type:r.type,amt:r.amt,cat:r.cat,note:r.note,rec:1});ch=1}});if(ch)save()}
function toast(m,u){const t=$('#toast');t.innerHTML=esc(m)+(u?'<button>Undo</button>':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,5000)}
$('#toast').addEventListener('click',async e=>{if(e.target.tagName==='BUTTON'&&lastDel){S.tx.push(lastDel);lastDel=null;$('#toast').hidden=true;await save();render()}});
function openTx(id){const f=$('#dlg form'),t=id&&S.tx.find(x=>x.id===id),k=t?t.type:'expense';f.reset();f.elements.tid.value=t?t.id:'';f.kind.value=k;
 $('#chips').innerHTML=chips(k==='income'?INC:EXP,t&&t.cat);f.date.value=t?t.date:today();f.amt.value=t?t.amt:'';f.note.value=t&&t.note||'';$('#dt').textContent=t?'Edit entry':'New entry';$('#recl').hidden=!!t;$('#nl').hidden=true;$('#dlg').showModal()}
function txDialog(){return`<dialog id="dlg" aria-label="Add transaction"><form data-f="tx" class="sheet"><div class="row"><h3 id="dt">New entry</h3><input type="hidden" name="tid"><button type="button" class="x" data-a="close" aria-label="Close">✕</button></div>
 <div class="seg"><label><input type="radio" name="kind" value="expense" data-c="kind" checked><span>Expense</span></label><label><input type="radio" name="kind" value="income" data-c="kind"><span>Income</span></label></div>
 <input class="amt num" name="amt" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0" required aria-label="Amount">
 <div class="chips" id="chips">${chips(EXP)}</div><button type="button" class="btn alt" data-a="newcat" style="justify-self:start">+ New category</button><label>Date<input name="date" type="date" value="${today()}" required></label>
 <label>Note<input name="note" maxlength="80" placeholder="Optional"></label><div id="recl"><label>Repeat<select name="rp" data-c="rp"><option value="">Does not repeat</option><option value="m">Every month</option><option value="emi">EMI (fixed instalments)</option></select></label><label id="nl" hidden>Total instalments in months (amount above = one EMI)<input name="n" type="number" min="2" max="360" inputmode="numeric" placeholder="e.g. 24"></label></div><button class="btn wide">Save entry</button></form></dialog>`}
function vBud(){const sp=Object.fromEntries(byCat(inM(month)));
 return`<div class="row"><h2>Monthly budgets</h2><span class="row" style="gap:8px"><button class="btn alt" data-a="autobud">✨ Auto-suggest</button><button class="btn" data-a="newcat">+ New category</button></span></div><div class="card">${EXP.map(c=>{const b=S.budgets[c]||0,s=sp[c]||0,p=b?s/b*100:0;return`<div class="row"><label>${CE[c]} ${c}<input type="number" min="0" value="${b||''}" placeholder="No limit" data-c="bud" data-k="${c}"></label><span class="num ${p>100?'exp':''}">${fmt(s)}${b?' of '+fmt(b):''}</span></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:${p>100?'var(--exp)':p>80?'var(--warn)':col(c)}"></i></div>`}).join('')}</div>${recCard()}${catCard()}`}
function vWealth(){return`<h2>Savings goals</h2><div class="card"><form class="f" data-f="goal"><label>Goal<input name="n" required maxlength="40"></label><label>Target<input name="t" type="number" min="1" required></label><button class="btn">Add goal</button></form>
 ${S.goals.map(g=>{const p=Math.min(g.saved/g.target*100,100);return`<div class="li" style="display:block"><div class="row"><b>${esc(g.n)}</b><span class="num">${fmt(g.saved)} / ${fmt(g.target)}</span></div><div class="bar"><i style="width:${p}%;background:var(--inc)"></i></div>
 <form class="f" data-f="fund" data-id="${g.id}"><input name="a" type="number" step="0.01" placeholder="Amount" required><button class="btn alt">Add funds</button><button type="button" class="btn alt" data-a="delgoal" data-id="${g.id}">Remove</button></form></div>`}).join('')}</div>
 <h2>Accounts and net worth</h2><div class="card"><form class="f" data-f="acct"><label>Account<input name="n" required maxlength="40"></label><label>Balance (negative for debt)<input name="b" type="number" step="0.01" required></label><button class="btn">Add</button></form>
 ${S.accts.map(a=>`<div class="li"><span>${esc(a.n)}</span><span class="row"><input type="number" step="0.01" value="${a.bal}" data-c="acct" data-id="${a.id}" style="width:130px" aria-label="Balance for ${esc(a.n)}"><button data-a="delacct" data-id="${a.id}" aria-label="Remove">✕</button></span></div>`).join('')}
 <div class="li"><b>Net worth</b><b class="num">${fmt(S.accts.reduce((a,x)=>a+x.bal,0))}</b></div></div>`}
function vTools(){const avg=[1,2,3].reduce((a,i)=>a+sum(inM(shift(month,-i)),'expense'),0)/3;
 return`<h2>Investment growth (SIP / compound)</h2><div class="card"><form class="f" data-c="calc" data-k="sip"><label>Starting amount<input name="p" type="number" value="0"></label><label>Monthly deposit<input name="m" type="number" value="10000"></label><label>Return % per year<input name="r" type="number" step="0.1" value="12"></label><label>Years<input name="y" type="number" value="10"></label></form><div class="res num" id="sip"></div></div>
 <h2>Loan EMI</h2><div class="card"><form class="f" data-c="calc" data-k="emi"><label>Loan amount<input name="p" type="number" value="1000000"></label><label>Interest % per year<input name="r" type="number" step="0.1" value="9"></label><label>Years<input name="y" type="number" value="5"></label></form><div class="res num" id="emi"></div></div>
 <h2>Safety nets</h2><div class="card"><table><tr><td>Average monthly spend, last 3 months</td><td class="num">${fmt(avg)}</td></tr><tr><td>Emergency fund (6 months)</td><td class="num">${fmt(avg*6)}</td></tr><tr><td>Financial independence number (25× yearly spend)</td><td class="num">${fmt(avg*12*25)}</td></tr></table></div>`}
function vSet(){return`<h2>Settings</h2><div class="card"><label>Currency<select data-c="cur">${['INR','USD','EUR','GBP','AED','SGD','AUD','CAD','JPY'].map(c=>`<option ${c===S.cur?'selected':''}>${c}</option>`).join('')}</select></label></div>
 <h2>Backup and security</h2><div class="card"><p class="mute">${KEY?'Your data is encrypted with AES-256-GCM. Backups stay encrypted.':'Your data is NOT encrypted. Add a passphrase below.'} Data lives only in this browser, so back it up regularly.</p>
 <div class="row" style="justify-content:flex-start"><button class="btn" data-a="bk">Download backup</button><label class="btn alt" style="color:var(--ink)">Restore backup<input type="file" accept=".json" data-c="restore" hidden></label><button class="btn alt" data-a="csv">Export CSV</button><label class="btn alt" style="color:var(--ink)">Import CSV<input type="file" accept=".csv" data-c="icsv" hidden></label>${KEY?'<button class="btn alt" data-a="lock">Lock now</button>':''}</div>
 <form class="f" data-f="pass" style="margin-top:14px"><label>${KEY?'Change':'Set'} passphrase<input name="pw" type="password" minlength="10" autocomplete="new-password" required></label><button class="btn">Save</button></form></div>
 <div class="card"><button class="btn bad" data-a="wipe">Erase all data</button></div>`}
const V={home:vHome,tx:vTx,bud:vBud,wealth:vWealth,tools:vTools,set:vSet},T={home:'Home',tx:'Activity',bud:'Budgets',wealth:'Wealth',tools:'Tools',set:'More'};
const TC={home:'#ffb02e',tx:'#4b8bff',bud:'#a855f7',wealth:'#10b981',tools:'#06b6d4',set:'#ec4899'};
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',tx:'<path d="M4 6h16M4 12h16M4 18h10"/>',bud:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',wealth:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h5M6 6l9-3"/>',tools:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
function render(){applyCats();applyRec();A.innerHTML=`<div class="top"><div class="brand"><i>₹</i><div><h1>Ledgerly</h1><span class="mute">${['Good morning','Good afternoon','Good evening'][new Date().getHours()<12?0:new Date().getHours()<17?1:2]}</span></div></div><button class="eye" data-a="eye" aria-label="Hide or show amounts">👁</button></div>${V[view]()}<button class="fab" data-a="add" aria-label="Add transaction">+</button><nav aria-label="Sections">${Object.keys(T).map(k=>`<button data-a="nav" data-k="${k}" style="--c:${TC[k]}" ${k===view?'aria-current="true"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${T[k]}</button>`).join('')}</nav>${txDialog()}${catDialog()}`;if(view==='tools')calc();bump()}
function calc(){const g=k=>Object.fromEntries([...document.querySelectorAll(`[data-k=${k}] input`)].map(i=>[i.name,+i.value||0]));
 let s=g('sip'),r=s.r/1200,n=s.y*12,fv=s.p*Math.pow(1+r,n)+(r?s.m*(Math.pow(1+r,n)-1)/r:s.m*n),inv=s.p+s.m*n;
 $('#sip').innerHTML=`${fmt(fv)} <span class="mute">from ${fmt(inv)} invested, ${fmt(fv-inv)} growth</span>`;
 let e=g('emi'),q=e.r/1200,N=e.y*12,emi=q?e.p*q*Math.pow(1+q,N)/(Math.pow(1+q,N)-1):e.p/(N||1);
 $('#emi').innerHTML=`${fmt(emi)} / month <span class="mute">total interest ${fmt(emi*N-e.p)}</span>`}
/* ---------- events ---------- */
const dl=(name,text,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const cell=v=>{v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
function parseCSV(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'&&t[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
A.addEventListener('click',async e=>{if(e.target.id==='dlg'||e.target.id==='cdlg')return e.target.close();const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='nav'){view=b.dataset.k;scrollTo(0,0);return render()}
 if(a==='pm'||a==='nm'){month=shift(month,a==='pm'?-1:1);return render()}
 if(a==='add')return openTx();
 if(a==='newcat'){$('#cdlg form').reset();return $('#cdlg').showModal()}
 if(a==='cclose')return $('#cdlg').close();
 if(a==='edit')return openTx(id);
 if(a==='close')return $('#dlg').close();
 if(a==='plain'){S=def();await save();return render()}
 if(a==='deltx'){lastDel=S.tx.find(t=>t.id===id);S.tx=S.tx.filter(t=>t.id!==id);toast('Entry deleted',1)}
 else if(a==='delcat'){S.cats=S.cats.filter(c=>c.name!==id);delete S.budgets[id]}
 else if(a==='delrec')S.rec=S.rec.filter(r=>r.id!==id);
 else if(a==='autobud'){EXP.forEach(c=>{let t=0;[1,2,3].forEach(i=>t+=sum(inM(shift(month,-i)).filter(x=>x.cat===c),'expense'));const v=Math.ceil(t/3/100)*100;if(v>0)S.budgets[c]=v});toast('Budgets set from your last 3 months')}
 else if(a==='eye'){document.body.classList.toggle('hide');localStorage.setItem('fth',document.body.classList.contains('hide')?'1':'');return}
 else if(a==='delgoal')S.goals=S.goals.filter(g=>g.id!==id);
 else if(a==='delacct')S.accts=S.accts.filter(x=>x.id!==id);
 else if(a==='lock')return lockNow();
 else if(a==='bk')return dl('ledgerly-backup.json',localStorage.getItem('ft'),'application/json');
 else if(a==='csv')return dl('transactions.csv','date,type,amount,category,note\n'+S.tx.map(t=>[t.date,t.type,t.amt,t.cat,t.note||''].map(cell).join(',')).join('\n'),'text/csv');
 else if(a==='wipe'){if(!confirm('Erase everything stored by this app? This cannot be undone.'))return;localStorage.removeItem('ft');S=null;KEY=null;return boot()}
 await save();render()});
A.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f));if(!k)return;
 if(k==='setup'||k==='unlock'){try{if(k==='setup'){S=def();await setPass(d.pw)}else await unlock(d.pw);return render()}catch(x){$('#err').textContent=k==='unlock'?'Wrong passphrase.':'Could not create vault.';return}}
 if(k==='cat'){const nm=d.name.trim();if(!nm)return;if(EXP.concat(INC).some(x=>x.toLowerCase()===nm.toLowerCase()))return alert('That category already exists.');
 (S.cats=S.cats||[]).push({name:nm,emoji:d.emo,type:d.ctype});applyCats();if(d.ctype==='expense'&&+d.bud>0)S.budgets[nm]=+d.bud;await save();$('#cdlg').close();
 if($('#dlg').open){$('#dlg form').kind.value=d.ctype;$('#chips').innerHTML=chips(d.ctype==='income'?INC:EXP,nm);return}
 return render()}
 if(k==='tx'){const inc=INC.includes(d.cat),o={date:d.date,type:inc?'income':'expense',amt:Math.abs(+d.amt),cat:d.cat,note:d.note};
 if(d.rp==='emi'&&!d.tid&&!(+d.n>=2))return alert('Enter the total number of EMI instalments (2 or more).');
 if(d.tid)Object.assign(S.tx.find(x=>x.id===d.tid),o);else{S.tx.push({id:uid(),...o});if(d.rp)(S.rec=S.rec||[]).push({id:uid(),...o,day:Math.min(28,+d.date.slice(8)),last:d.date.slice(0,7),...(d.rp==='emi'?{emi:1,total:Math.min(360,+d.n),paid:1}:{})})}
 month=d.date.slice(0,7)}
 if(k==='goal')S.goals.push({id:uid(),n:d.n,target:+d.t,saved:0});
 if(k==='fund')S.goals.find(g=>g.id===f.dataset.id).saved+=+d.a;
 if(k==='acct')S.accts.push({id:uid(),n:d.n,bal:+d.b});
 if(k==='pass')await setPass(d.pw);
 await save();render()});
A.addEventListener('input',e=>{if(e.target.closest('[data-c=calc]'))calc();if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=txList()}});
A.addEventListener('change',async e=>{const t=e.target,c=t.dataset.c;if(!c||c==='calc')return;
 if(c==='rp'){$('#nl').hidden=t.value!=='emi';const e=$('#chips input[value=EMI]');if(t.value==='emi'&&e)e.checked=true;return}
 if(c==='kind'){$('#chips').innerHTML=chips(t.value==='income'?INC:EXP);return}
 if(c==='month'&&t.value){month=t.value;return render()}
 if(c==='bud'){const v=+t.value;if(v>0)S.budgets[t.dataset.k]=v;else delete S.budgets[t.dataset.k]}
 if(c==='acct')S.accts.find(x=>x.id===t.dataset.id).bal=+t.value||0;
 if(c==='cur')S.cur=t.value;
 if(c==='restore'&&t.files[0]){const o=JSON.parse(await t.files[0].text());if(!('e' in o))return alert('Not a Ledgerly backup.');localStorage.setItem('ft',JSON.stringify(o));S=null;KEY=null;return boot()}
 if(c==='icsv'&&t.files[0]){const rows=parseCSV(await t.files[0].text()).slice(1);let n=0;rows.forEach(r=>{const[date,type,amt,cat,note]=r,v=Math.abs(parseFloat(amt));if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&(type==='income'||type==='expense')&&v>0){S.tx.push({id:uid(),date,type,amt:v,cat:(cat||'Other').slice(0,40),note:(note||'').slice(0,80)});n++}});alert(n+' transactions imported.')}
 await save();render()});
if(localStorage.getItem('fth'))document.body.classList.add('hide');
boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
